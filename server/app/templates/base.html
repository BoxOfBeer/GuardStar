<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "GuardStar" }}</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      .card { max-width: 720px; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
      input { padding: 10px; width: 100%; box-sizing: border-box; margin: 8px 0; }
      button { padding: 10px 14px; }
      .error { color: #b00020; margin-top: 8px; }
      code { font-size: 1.05em; }
      a { color: #0b57d0; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .muted { color: #666; }
      pre { background: #f7f7f7; padding: 12px; border-radius: 8px; overflow: auto; }
      table { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      td a { display: inline-block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
